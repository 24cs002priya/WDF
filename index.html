<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header with logos -->
  <div class="header">
    <img src="charusatlogo.png" alt="University Logo" class="logo-left">
    <img src="cspitlogo.png" alt="College Logo" class="logo-right">
  </div>

  <!-- Login Section -->
  <div class="section">
    <h2>Login Page</h2>
    <form action="home.html" method="get">
      <p>
        Username: 
        <input type="text" required>
      </p>
      <p>
        Password: 
        <input type="password" required>
      </p>
      <p>
        <button type="submit">Login</button>
      </p>
    </form>
  </div>

</body>
</html>

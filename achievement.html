<!DOCTYPE html>
<html>
<head>
  <title>Achievements</title>
  <link rel="stylesheet" href="style.css">
  <style>
  
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  text-align: center;
}


.header {
  background-color: white;
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #007acc;
  flex-wrap: wrap;
}

.header img {
  height: 60px;
  max-width: 100%;
}


.navbar {
  background-color: #007acc;
  overflow: hidden;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
}

.nav-left,
.nav-right {
  display: flex;
  flex-wrap: wrap;
}

.navbar a {
  color: white;
  padding: 14px 16px;
  text-decoration: none;
  display: block;
}

.navbar a:hover {
  background-color: #005f99;
}


.section {
  background-color: rgba(255, 255, 255, 0.9);
  margin: 30px auto;
  padding: 20px;
  width: 90%;
  max-width: 1200px;
  border-radius: 8px;
  box-sizing: border-box;
  text-align: left;
}

form p {
  margin: 15px 0;
}

form input {
  padding: 8px;
  margin-left: 10px;
}

form button {
  padding: 8px 16px;
  background-color: #007acc;
  color: white;
  border: none;
  border-radius: 4px;
}

form button:hover {
  background-color: #005f99;
}


.section table {
  width: 100%;
  border-collapse: collapse;
}

.section th,
.section td {
  padding: 10px;
  border: 1px solid #ccc;
  text-align: center;
}

.section table {
  overflow-x: auto;
  display: block;
  white-space: nowrap;
}

.section table::-webkit-scrollbar {
  height: 8px;
}

.section table::-webkit-scrollbar-thumb {
  background-color: #007acc;
  border-radius: 4px;
}

.section table::-webkit-scrollbar-track {
  background: #f1f1f1;
}

.section .achievement-images {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

.section .achievement-images img {
  border-radius: 8px;
  max-width: 100%;
  height: auto;
}


@media (max-width: 1024px) {
  .section .achievement-images img {
    width: calc(50% - 15px);
  }
}

@media (max-width: 768px) {
  .header {
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .header img {
    margin: 10px 0;
    height: auto;
    max-height: 60px;
    max-width: 90%;
  }

  .navbar {
    flex-direction: column;
    align-items: center;
  }

  .nav-left, .nav-right {
    flex-direction: column;
    width: 100%;
    text-align: center;
  }

  .navbar a {
    padding: 10px;
    width: 100%;
  }

  .section {
    width: 95%;
    padding: 15px;
  }

  form p {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  form input {
    margin: 5px 0 0 0;
    width: 100%;
    box-sizing: border-box;
  }

  .section table {
    font-size: 0.9rem;
  }

  .section .achievement-images img {
    width: 100%;
  }

@media (max-width: 768px) {
  .section {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .section img {
    display: block;
    width: 90%;
    max-width: 300px;
    margin: 10px 0;
  }
}

}

  </style>
</head>
<body>

  
 <div class="header">
    <img src="charusatlogo.png" alt="University Logo">
    <img src="cspitlogo.png" alt="College Logo">
  </div>
  <div class="navbar">
    <div class="nav-left">
      <a href="index.html">Home</a>
      <a href="profile.html">Profile</a>
      <a href="timetable.html">Time Table</a>
      <a href="attendance.html">Attendance</a>
      <a href="achievement.html">Achievements</a>
      <a href="result.html">Result</a>
      <a href="fees.html">Fees</a>
      <a href="leave.html">Leave App</a>
      <a href="course.html">Course Reg</a>
    </div>
    <div class="nav-right">
      <a href="index.html">Logout</a>
    </div>
  </div>

  
  <div class="section">

</body>
</html>
